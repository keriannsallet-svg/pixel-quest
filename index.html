class Game {
  constructor() {
    this.canvas = document.getElementById('cv');
    this.ctx = this.canvas.getContext('2d');
    this.input = new Input();
    this.audio = new AudioMan();
    this.particles = new Particles();
    this.texts = new FloatTexts();
    this.camera = new Camera();
    this.save = new SaveSystem();
    this.audio.enabled = this.save.data.sound;
    this.player = null;
    this.level = null;
    this.levelNum = 1;
    this.state = 'menu';
    this.paused = false;
    this.t = 0;
    this.endT = 0;
    this.deaths = 0;
    this.acc = 0;
    this.last = performance.now();
    this.optionsFrom = 'menu';
    this.bindUI();
    this.resize();
    window.addEventListener('resize', () => this.resize());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && this.state === 'playing' && !this.paused) this.pause();
    });
    requestAnimationFrame(ts => this.loop(ts));
  }

  resize() {
    const ratio = VIEW_W / VIEW_H;
    let w = window.innerWidth, h = window.innerHeight;
    if (w / h > ratio) w = h * ratio; else h = w / ratio;
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
  }

  bindUI() {
    const $ = id => document.getElementById(id);
    const click = (id, fn) => $(id).addEventListener('click', () => { this.audio.init(); this.audio.click(); fn(); });
    click('btnPlay', () => this.startLevel(Math.min(this.save.data.unlocked, 10)));
    click('btnLevels', () => { this.state = 'levels'; this.showOnly('levels'); this.renderGrid(); });
    click('btnOptions', () => { this.optionsFrom = 'menu'; this.state = 'options'; this.showOnly('options'); this.syncSoundBtns(); });
    click('btnLevelsBack', () => { this.state = 'menu'; this.showOnly('menu'); });
    click('btnResume', () => this.resume());
    click('btnRestart', () => this.startLevel(this.levelNum));
    click('btnPauseOptions', () => { this.optionsFrom = 'pause'; this.state = 'options'; this.showOnly('options'); this.syncSoundBtns(); });
    click('btnQuit', () => this.quitToMenu());
    click('optSound', () => {
      this.audio.init();
      const on = this.audio.toggle();
      this.save.data.sound = on; this.save.save();
      this.syncSoundBtns();
    });
    click('optReset', () => {
      if (confirm('Êtes-vous sûr de vouloir réinitialiser toute votre progression ?')) {
        this.save.reset();
        this.audio.enabled = this.save.data.sound;
        this.syncSoundBtns();
        this.renderGrid();
      }
    });
    click('btnOptBack', () => {
      if (this.optionsFrom === 'pause') { this.state = 'paused'; this.showOnly('pause'); }
      else { this.state = 'menu'; this.showOnly('menu'); }
    });
    click('btnRetry', () => this.startLevel(this.levelNum));
    click('btnGoLevels', () => { this.state = 'levels'; this.showOnly('levels'); this.renderGrid(); });
    click('btnNext', () => this.startLevel(Math.min(10, this.levelNum + 1)));
    click('btnReplay', () => this.startLevel(this.levelNum));
    click('btnVicLevels', () => { this.state = 'levels'; this.showOnly('levels'); this.renderGrid(); });
    $('soundBtn').addEventListener('click', () => {
      this.audio.init();
      const on = this.audio.toggle();
      this.save.data.sound = on; this.save.save();
      this.syncSoundBtns();
    });

    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (this.state === 'playing') this.pause();
        else if (this.state === 'paused') this.resume();
        else if (this.state === 'options') $('btnOptBack').click();
        else if (this.state === 'levels') $('btnLevelsBack').click();
      }
      if ((e.key === 'r' || e.key === 'R') && this.state === 'playing' && !this.paused) {
        this.startLevel(this.levelNum);
      }
    });

    // contrôles tactiles
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      $('touch').style.display = 'flex';
      const bind = (id, on, off) => {
        const el = $(id);
        el.addEventListener('touchstart', e => { e.preventDefault(); this.audio.init(); on(); }, { passive: false });
        el.addEventListener('touchend', e => { e.preventDefault(); off(); }, { passive: false });
        el.addEventListener('touchcancel', () => off());
      };
      bind('tLeft', () => { this.input.touch.left = true; }, () => { this.input.touch.left = false; });
      bind('tRight', () => { this.input.touch.right = true; }, () => { this.input.touch.right = false; });
      bind('tJump', () => { this.input.touch.jump = true; this.input.pressed['tj'] = true; }, () => { this.input.touch.jump = false; });
    }
  }

  syncSoundBtns() {
    const on = this.audio.enabled;
    document.getElementById('soundBtn').textContent = on ? '🔊 ON' : '🔇 OFF';
    document.getElementById('optSound').textContent = on ? '🔊 SON : ON' : '🔇 SON : OFF';
  }

  showOnly(id) {
    for (const s of ['menu', 'levels', 'pause', 'options', 'gameover', 'victory']) {
      document.getElementById(s).classList.toggle('hidden', s !== id);
    }
  }

  renderGrid() {
    const grid = document.getElementById('levelGrid');
    grid.innerHTML = '';
    for (let i = 1; i <= 10; i++) {
      const unlocked = i <= this.save.data.unlocked;
      const card = document.createElement('div');
      card.className = 'level-card' + (unlocked ? '' : ' locked');
      const stars = this.save.data.stars[i] || 0;
      const high = this.save.data.high[i] || 0;
      card.innerHTML = `<div class="level-num">${unlocked ? i : '🔒'}</div>
        <div class="level-name">${LEVELS[i - 1].name}</div>
        <div class="level-stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
        ${high ? `<div class="level-high">${high}</div>` : ''}`;
      if (unlocked) {
        card.addEventListener('click', () => { this.audio.init(); this.audio.click(); this.startLevel(i); });
      }
      grid.appendChild(card);
    }
  }

  startLevel(n) {
    this.levelNum = n;
    this.level = new Level(LEVELS[n - 1]);
    this.player = new Player(this.level.spawn.x, this.level.spawn.y);
    this.player.slippery = this.level.slippery;
    this.player.lowG = this.level.lowG;
    this.camera.x = clamp(this.player.x - VIEW_W / 2, 0, Math.max(0, this.level.w - VIEW_W));
    this.camera.y = 0;
    this.state = 'playing';
    this.paused = false;
    this.endT = 0;
    this.deaths = 0;
    this.showOnly(null);
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('soundBtn').classList.remove('hidden');
    document.getElementById('bossWrap').classList.toggle('hidden', !this.level.boss);
    this.syncSoundBtns();
    this.audio.startMusic(this.level.theme);
    this.updateHUD();
  }

  pause() {
    if (this.state !== 'playing') return;
    this.paused = true;
    this.state = 'paused';
    this.showOnly('pause');
    this.audio.stopMusic();
  }

  resume() {
    if (this.state !== 'paused') return;
    this.paused = false;
    this.state = 'playing';
    this.showOnly(null);
    this.audio.startMusic(this.level.theme);
  }

  quitToMenu() {
    this.state = 'menu';
    this.paused = false;
    this.showOnly('menu');
    this.audio.stopMusic();
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('soundBtn').classList.add('hidden');
    document.getElementById('bossWrap').classList.add('hidden');
  }

  updateHUD() {
    const p = this.player, lvl = this.level;
    document.getElementById('hudScore').textContent = p.score;
    document.getElementById('hudLives').textContent = p.lives > 0 ? '❤'.repeat(p.lives) : '💀';
    document.getElementById('hudWorld').textContent = 'MONDE ' + this.levelNum + ' · ' + lvl.name;
    const time = Math.max(0, Math.ceil(lvl.time));
    const te = document.getElementById('hudTime');
    te.textContent = '⏱ ' + time;
    te.classList.toggle('warning', time <= 30);
    if (lvl.boss) {
      document.getElementById('bossFill').style.width = Math.max(0, lvl.boss.hp / lvl.boss.maxHp * 100) + '%';
    }
  }

  update() {
    this.t++;
    const p = this.player, lvl = this.level;
    p.update(this.input, lvl, this);
    lvl.update(p, this);
    this.particles.update();
    this.texts.update();
    this.camera.follow(p, lvl);
    this.updateHUD();

    if (p.dead && p.deathT <= 0) {
      if (p.lives <= 0) { this.gameOver(); return; }
      p.respawn(lvl.spawn.x, lvl.spawn.y);
      this.camera.x = clamp(p.x - VIEW_W / 2, 0, Math.max(0, lvl.w - VIEW_W));
    }

    if (lvl.boss && !lvl.boss.alive && this.endT <= 0) this.endT = 130;
    if ((p.won || (lvl.boss && !lvl.boss.alive)) && this.state === 'playing') {
      this.endT--;
      if (this.endT <= 0) this.victory();
    }
    this.input.postStep();
  }

  gameOver() {
    this.state = 'gameover';
    this.audio.stopMusic();
    this.audio.gameover();
    document.getElementById('goScore').textContent = this.player.score;
    document.getElementById('goLevel').textContent = this.levelNum;
    this.showOnly('gameover');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('bossWrap').classList.add('hidden');
  }

  victory() {
    if (this.state !== 'playing') return;
    this.state = 'victory';
    this.audio.stopMusic();
    this.audio.victory();
    const p = this.player, lvl = this.level;
    p.score += Math.ceil(lvl.time) * 5; // bonus de temps
    let stars = 1;
    if (lvl.coins.length === 0 || p.coins >= Math.ceil(lvl.coins.length * 0.5)) stars++;
    if (lvl.time >= lvl.timeLimit * 0.2 && this.deaths === 0) stars++;
    this.save.completeLevel(this.levelNum, p.score, stars, lvl.timeLimit - lvl.time);

    document.getElementById('vicTitle').textContent = this.levelNum === 10 ? '🎉 AS VICTOIRE !' : '🏆 NIVEAU TERMINÉ !';
    document.getElementById('vicScore').textContent = p.score;
    document.getElementById('vicTime').textContent = Math.ceil(lvl.time);
    document.getElementById('vicCoins').textContent = p.coins;
    const starsEl = document.getElementById('vicStars');
    starsEl.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 'star-big' + (i < stars ? '' : ' off');
      s.textContent = '★';
      starsEl.appendChild(s);
    }
    document.getElementById('btnNext').style.display = this.levelNum < 10 ? 'block' : 'none';
    this.showOnly('victory');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('bossWrap').classList.add('hidden');
    for (let i = 0; i < 6; i++) {
      setTimeout(() => {
        this.particles.burst(VIEW_W / 2 + (Math.random() - 0.5) * 500, VIEW_H / 2 + (Math.random() - 0.5) * 250,
          18, ['#ffd54a', '#ff8a65', '#f48fb1', '#80d8ff'][i % 4], 5, 45, 5, 0.06, 'star');
      }, i * 180);
    }
  }

  shake(n) { this.camera.shake(n); }

  loop(ts) {
    requestAnimationFrame(t => this.loop(t));
    let dt = (ts - this.last) / 1000;
    this.last = ts;
    if (dt > 0.25) dt = 0.25;
    if (this.state === 'playing' && !this.paused) {
      this.acc += dt;
      let n = 0;
      while (this.acc >= STEP && n < 5) { this.update(); this.acc -= STEP; n++; }
      if (n === 5) this.acc = 0;
    } else {
      this.t++;
    }
    this.render();
  }

  render() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, VIEW_W, VIEW_H);
    if (!this.level || !this.player || this.state === 'menu' || this.state === 'levels' || this.state === 'options') {
      this.drawMenuScene(ctx);
      return;
    }
    const camX = this.camera.ox, camY = this.camera.oy;
    this.level.drawBackground(ctx, camX, camY, this.t);
    this.level.drawLava(ctx, camX, camY, this.t);
    this.level.drawPlats(ctx, camX, camY, this.t);
    this.level.drawBlocks(ctx, camX, camY);
    this.level.drawCoins(ctx, camX, camY, this.t);
    this.level.drawFlag(ctx, camX, camY, this.t);
    for (const e of this.level.enemies) e.draw(ctx, camX, camY, this.t);
    if (this.level.boss) this.level.boss.draw(ctx, camX, camY, this.t);
    this.player.draw(ctx, camX, camY, this.t);
    this.particles.draw(ctx, camX, camY);
    this.texts.draw(ctx, camX, camY);
    if (this.level.darkness > 0) this.drawDarkness(ctx);
  }

  drawDarkness(ctx) {
    const px = this.player.x + this.player.w / 2 - this.camera.ox;
    const py = this.player.y + this.player.h / 2 - this.camera.oy;
    const g = ctx.createRadialGradient(px, py, 60, px, py, 260);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,' + this.level.darkness + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  drawMenuScene(ctx) {
    const t = this.t;
    const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    g.addColorStop(0, '#6ec6ff'); g.addColorStop(1, '#e3f4ff');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = '#fff59d';
    ctx.beginPath(); ctx.arc(VIEW_W - 130, 90, 42, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,245,157,0.3)';
    ctx.beginPath(); ctx.arc(VIEW_W - 130, 90, 62, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 5; i++) {
      const x = ((i * 260 + t * 0.4) % (VIEW_W + 240)) - 120;
      const y = 50 + i * 32;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.ellipse(x, y, 42, 18, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 30, y - 10, 30, 14, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    const ridge = (par, color, base, amp, freq) => {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, VIEW_H);
      for (let x = 0; x <= VIEW_W; x += 24) {
        ctx.lineTo(x, base + Math.sin((x + t * par * 20) * freq) * amp);
      }
      ctx.lineTo(VIEW_W, VIEW_H);
      ctx.closePath(); ctx.fill();
    };
    ridge(0.12, '#7ec850', VIEW_H - 150, 40, 0.008);
    ridge(0.3, '#5da83f', VIEW_H - 100, 28, 0.014);
    ctx.fillStyle = '#8a5a3b';
    ctx.fillRect(0, VIEW_H - 90, VIEW_W, 90);
    ctx.fillStyle = '#58b368';
    ctx.fillRect(0, VIEW_H - 90, VIEW_W, 12);
    // héros animé
    drawHero(ctx, VIEW_W / 2 - 130, VIEW_H - 126, 24, 36, 1, 'idle', t, 1, 1, false, t);
    // pièces flottantes
    for (let i = 0; i < 4; i++) {
      const x = VIEW_W / 2 + 40 + i * 46;
      const y = VIEW_H - 150 - Math.sin(t * 0.05 + i) * 10;
      const sq = Math.abs(Math.cos((t + i * 10) * 0.06));
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(0.3 + sq * 0.7, 1);
      ctx.fillStyle = '#ffd54a';
      ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffb300';
      ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    if (Math.random() < 0.12) {
      this.particles.spawn(Math.random() * VIEW_W, VIEW_H + 5, 0, -0.5, 120, 2.5, 'rgba(255,213,74,0.7)', -0.005, 'circle');
    }
    this.particles.update();
    this.particles.draw(ctx, 0, 0);
  }
}

// DÉMARRAGE
// ==============================
window.game = new Game();

</script>
